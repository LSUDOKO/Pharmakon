  RE: [cough, cold, bronch, asthma, respirat, lung, expector, flu, influenza, pneumon]
  RL: [throat, tonsil, sinus, nose, pharyng, laryng]
  UR: [diuretic, kidney, urinar, bladder, renal, nephr, cystit, prostat]
  GY: [menstru, gynaec, gynec, uter, vagin, dysmenor, menopaus]
  MA: [lactat, galactag, childbirth, pregnan, labour, labor]
  CV: [blood pressure, hypertens, heart, cardi, haemorrhoid, hemorrhoid, circulat, varicose, cholesterol, oedema, edema]
  LG: [liver, hepat, gall, jaundice, bile, bilious]
  FV: [fever, febri, antipyret]
