# Greek condition vocabulary for rule-based extraction (rule_extract_v1) and condition mapping
# (lexicon_map_v1). Keys are accent-stripped lowercase stems matched at the START of a word.
# `mesh` lists candidate MeSH descriptor labels; they are only kept if the NLM MeSH lookup API
# confirms an exact label match (generate-then-verify). Glosses follow LSJ senses and stay
# deliberately cautious; `mesh: []` means "no defensible modern equivalent".
# `pilot: true` marks the skin/wound prefilter vocabulary (spec/05 Stage 2).
