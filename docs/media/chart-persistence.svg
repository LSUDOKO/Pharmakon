<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Did the uses survive 2,000 years?"><rect width="1200" height="640" rx="22" fill="#000000"/><rect x="1" y="1" width="1198" height="638" rx="21" fill="none" stroke="#22302a"/><path d="M1050 0 L1200 0 L1200 150 Z" fill="#17744f" opacity=".18"/><text x="36" y="52" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#eceee7">Did the uses survive 2,000 years?</text><text x="36" y="80" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8b938f">Dioscorides (1st c.) → Galen (2nd c.) → John the Physician (13th c.) → modern Greek villages.</text><text x="60.0" y="150.0" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#eceee7" text-anchor="start">Observed</text><text x="480.0" y="150.0" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#3dbb82" text-anchor="end">48.6%</text><rect x="60" y="162" width="420" height="16" rx="8" fill="#111a15"/><rect x="60" y="162" width="340.3" height="16" rx="8" fill="#3dbb82" opacity="1"/><text x="60.0" y="230.0" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#eceee7" text-anchor="start">Shuffled, average</text><text x="480.0" y="230.0" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#8b938f" text-anchor="end">40.8%</text><rect x="60" y="242" width="420" height="16" rx="8" fill="#111a15"/><rect x="60" y="242" width="285.5" height="16" rx="8" fill="#8b938f" opacity="0.45"/><text x="60.0" y="310.0" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#eceee7" text-anchor="start">Shuffled, 95th percentile</text><text x="480.0" y="310.0" font-family="'JetBrains Mono', Menlo, C