<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="How honest are the probabilities?"><rect width="1200" height="560" rx="22" fill="#000000"/><rect x="1" y="1" width="1198" height="558" rx="21" fill="none" stroke="#22302a"/><path d="M1050 0 L1200 0 L1200 150 Z" fill="#17744f" opacity=".18"/><text x="36" y="52" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#eceee7">How honest are the probabilities?</text><text x="36" y="80" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8b938f">Reliability diagram, calibrated model, 61 expert-identified names.</text><line x1="120.0" y1="470.0" x2="480.0" y2="110.0" stroke="#8b938f" stroke-width="1.5" stroke-dasharray="6 6"/><line x1="120.0" y1="470.0" x2="480.0" y2="470.0" stroke="#111a15" stroke-width="1"/><text x="108.0" y="474.0" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8b938f" text-anchor="end">0%</text><text x="120.0" y="492.0" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8b938f" text-anchor="middle">0%</text><line x1="120.0" y1="380.0" x2="480.0" y2="380.0" stroke="#111a15" stroke-width="1"/><text x="108.0" y="384.0" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8b938f" text-anchor="end">25%</text><text x="210.0" y="492.0" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8b938f" text-anchor="middle">25%</text><line x1="120.0" y1="290.0" x2="480.0" y2="290.0" stroke="#111a15" stroke-width="1"/><text x="108.0" y="294.0" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8b938f" text-anchor="end">50%</text><text x="300.0" y="492.0" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8b938f" text-anchor="middle">50%</text><line x1="120.0" y1="200.0" x2="480.0" y2="200.0" stroke="#111a15" stroke-width="1"/><text x="108.0" y="204.0" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8b938f" text-anchor="end">75%</text><text x="390.0" y="492.0" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8b938f" text-anchor="middle">75%</text><line x1="120.0" y1="110.0" x2="480.0" y2="110.0" stroke="#111a15" stroke-width="1"/><text x="108.0" y="114.0" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8b938f" text-anchor="end">100%</text><text x="480.0" y="492.0" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8b938f" text-anchor="middle">100%</text><rect x="159.0" y="290.0" width="30.0" height="180.0" fill="#17744f" opacity=".55"/><circle cx="189.0" cy="290.0" r="6.8" fill="#3dbb82" stroke="#000000" stroke-width="1.5"/><rect x="195.0" y="470.0" width="30.0" height="0.0" fill="#17744f" opacity=".55"/><circle cx="210.4" cy="470.0" r="8.0" fill="#3dbb82" stroke="#000000" stroke-width="1.5"/><rect x="231.0" y="245.0" width="30.0" height="225.0" fill="#17744f" opacity=".55"/><circle cx="245.1" cy="245.0" r="12.0" fill="#3dbb82" stroke="#000000" stroke-width="1.5"/><rect x="267.0" y="290.0" width="30.0" height="180.0" fill="#17744f" opacity=".55"/><circle cx="284.2" cy="290.0" r="8.0" fill="#3dbb82" stroke="#000000" stroke-width="1.5"/><rect x="303.0" y="306.4" width="30.0" height="163.6" fill="#17744f" opacity=".55"/><circle cx="314.3" cy="306.4" r="10.6" fill="#3dbb82" stroke="#000000" stroke-width="1.5"/><rect x="339.0" y="155.0" width="30.0" height="315.0" fill="#17744f" opacity=".55"/><circle cx="354.6" cy="155.0" r="9.7" fill="#3dbb82" stroke="#000000" stroke-width="1.5"/><rect x="375.0" y="110.0" width="30.0" height="360.0" fill="#17744f" opacity=".55"/><circle cx="388.3" cy="110.0" r="9.7" fill="#3dbb82" stroke="#000000" stroke-width="1.5"/><rect x="411.0" y="212.9" width="30.0" height="257.1" fill="#17744f" opacity=".55"/><circle cx="422.6" cy="212.9" r="9.3" fill="#3dbb82" stroke="#000000" stroke-width="1.5"/><rect x="447.0" y="470.0" width="30.0" height="0.0" fill="#17744f" opacity=".55"/><circle cx="445.9" cy="470.0" r="6.0" fill="#3dbb82" stroke="#000000" stroke-width="1.5"/><text x="300.0" y="518.0" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b938f" text-anchor="middle">model confidence in its top species</text><text transform="translate(60,290.0) rotate(-90)" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#8b938f" text-anchor="middle">share actually correct</text><text x="570.0" y="170.0" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="44" font-weight="600" fill="#ff5a5f" text-anchor="start">ECE 0.21</text><text x="570.0" y="205.0" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#eceee7" text-anchor="start">Expected calibration error. Target ≤ 0.10: missed.</text><text x="570.0" y="240.0" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8b938f" text-anchor="start">Dot size = names in the bin. The dashed line is perfect</text><text x="570.0" y="262.0" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8b938f" text-anchor="start">calibration. Errors run both ways and most bins hold</text><text x="570.0" y="284.0" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8b938f" text-anchor="start">fewer than ten names, so each bar is noisy.</text><text x="570.0" y="320.0" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8b938f" text-anchor="start">The oracle ablation reaches ECE 0.09: the missing</text><text x="570.0" y="342.0" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8b938f" text-anchor="start">morphology evidence (needs an LLM) is the main gap.</text></svg>