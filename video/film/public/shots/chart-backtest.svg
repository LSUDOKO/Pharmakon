<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="The time machine: did history predict later science?"><rect width="1200" height="600" rx="22" fill="#000000"/><rect x="1" y="1" width="1198" height="598" rx="21" fill="none" stroke="#22302a"/><path d="M1050 0 L1200 0 L1200 150 Z" fill="#17744f" opacity=".18"/><text x="36" y="52" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#eceee7">The time machine: did history predict later science?</text><text x="36" y="80" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8b938f">Rolling-origin backtest. Train on what was known at the cutoff, score pairs nobody had studied, check PubMed to 2025.</text><text x="154.0" y="185.0" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#eceee7" text-anchor="end">Random</text><text x="154.0" y="237.0" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#eceee7" text-anchor="end">Popularity</text><text x="154.0" y="289.0" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#eceee7" text-anchor="end">History</text><text x="154.0" y="341.0" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#eceee7" text-anchor="end">History + popularity</text><text x="154.0" y="393.0" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#eceee7" text-anchor="end">Everything</text><rect x="170" y="140" width="238" height="310" rx="14" fill="#0b120e"/><text x="289.0" y="130.0" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#eceee7" text-anchor="middle">cutoff 2000</text><line x1="205.2" y1="150.0" x2="205.2" y2="