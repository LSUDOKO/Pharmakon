[project]
name = "pharmakon"
version = "0.1.0"
description = "Uncertainty-aware, 2,000-year map of Greek and Byzantine pharmacology"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "duckdb>=1.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "lxml>=5",
  "openpyxl>=3.1",
  "requests>=2.31",
  "requests-cache>=1.2",
  "typer>=0.12",
  "pydantic>=2.6",
  "rapidfuzz>=3.6",
  "networkx>=3.2",
  "pyyaml>=6",
  "streamlit>=1.35",
  "plotly>=5.20",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
pharmakon = "pharmakon.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pharmakon"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: test needs internet access"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
